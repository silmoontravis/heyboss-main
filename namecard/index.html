* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.card {

.card::before {

}
.glow {

@keyframes wave {

  75% { transform: rotate(-5deg); }

.brand {

}
.link-item:hover {
  background: rgba(255,255,255,0.08);
  border-color: rgba(0,95,223,0.3);
  transform: translateY(-2px);
  box-shadow: 0 8px 24px rgba(0,0,0,0.2);
}
.link-item:active {

}
.link-icon {
