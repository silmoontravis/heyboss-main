* { margin: 0; padding: 0; box-sizing: border-box; }
body {

.card {

.glow { position: absolute; top: -60px; right: -60px; width: 200px; height: 200px;

.header { text-align: center; padding: 36px 24px 20px; position: relative; z-index: 1; }

@keyframes wave { 0%, 100% { transform: rotate(0deg); } 25% { transform: rotate(12deg); } 75% { transform: rotate(-5deg); } }
.brand { font-size: 26px; font-weight: 900; color: #fff; letter-spacing: 3px; margin-bottom: 16px; }

.title { display: inline-block; font-size: 10px; font-weight: 700; color: #0a1628;

.company { margin-top: 10px; font-size: 11px; color: rgba(255,255,255,0.35); letter-spacing: 1px; }

.links { padding: 6px 20px 16px; position: relative; z-index: 1; }
.link-item { display: flex; align-items: center; gap: 12px;
  padding: 12px 16px; margin-bottom: 8px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.06);
  border-radius: 14px; text-decoration: none; transition: all 0.3s; cursor: pointer; }
.link-item:hover { background: rgba(255,255,255,0.08); border-color: rgba(0,95,223,0.3);
  transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.2); }
.link-item:active { transform: translateY(0); }
.link-icon { width: 36px; height: 36px; border-radius: 10px;
  display: flex; align-items: center; justify-content: center; font-size: 16px; flex-shrink: 0; }
.link-icon.blue { background: rgba(0,95,223,0.15); }
.link-icon.green { background: rgba(6,214,160,0.15); }
.link-icon.purple { background: rgba(139,92,246,0.15); }
.link-icon.cyan { background: rgba(6,182,212,0.15); }
.link-label { font-size: 9px; color: rgba(255,255,255,0.35); font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
.link-value { font-size: 13px; color: rgba(255,255,255,0.9); font-weight: 500; }
.link-arrow { margin-left: auto; font-size: 14px; color: rgba(255,255,255,0.2); }

.social-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; padding: 0 20px 16px; position: relative; z-index: 1; }
.social-btn { display: flex; flex-direction: column; align-items: center; gap: 4px;

.social-btn:hover { background: rgba(255,255,255,0.08); border-color: rgba(237,198,38,0.3); transform: translateY(-2px); }
.social-btn .s-icon { font-size: 20px; }
.social-btn .s-name { font-size: 8px; color: rgba(255,255,255,0.4); font-weight: 600; }

/* Share buttons */
.share-section { padding: 4px 20px 20px; position: relative; z-index: 1; }
.share-btn { width: 100%; padding: 14px; border: none; border-radius: 14px; font-size: 14px;

  display: flex; align-items: center; justify-content: center; gap: 8px; margin-bottom: 8px; }
.share-btn.primary { background: linear-gradient(135deg, #06C755, #05a847); color: #fff; }
.share-btn.primary:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(6,199,85,0.3); }
.share-btn.secondary { background: rgba(255,255,255,0.06); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.7); }
.share-btn.secondary:hover { background: rgba(255,255,255,0.1); }

.footer { text-align: center; padding: 8px 20px 20px; position: relative; z-index: 1; }
.footer p { font-size: 9px; color: rgba(255,255,255,0.15); font-style: italic; letter-spacing: 1px; }
</style>

<script>
const LIFF_ID = '2010174397-70N7M5sQ';

// Flex Message 名片
const flexMessage = {
  type: 'flex',
  altText: 'Travis Chen — HEY!BOSS 銀月數位顧問',
  contents: {
    type: 'bubble',
    size: 'mega',
    header: {
      type: 'box', layout: 'vertical',
      backgroundColor: '#0d1b34',
      paddingAll: '20px',
      contents: [
        { type: 'image', url: 'https://www.heyboss.com.tw/heyboss/logos/logo_white_hand.png',
          size: '80px', aspectMode: 'fit' },
        { type: 'text', text: 'HEY!BOSS', color: '#ffffff', size: 'xl', weight: 'bold',
          align: 'center', margin: 'md' },
        { type: 'text', text: '陳柏宇 Travis Chen', color: '#ffffff', size: 'lg', weight: 'bold',
          align: 'center', margin: 'md' },
        { type: 'text', text: 'Founder & CEO', color: '#EDC626', size: 'xs', align: 'center', margin: 'sm' },
        { type: 'text', text: '銀月數位顧問股份有限公司', color: '#8899aa', size: 'xxs',
          align: 'center', margin: 'sm' }
      ]
    },
    body: {
      type: 'box', layout: 'vertical',
      backgroundColor: '#0f2042',
      paddingAll: '20px', spacing: 'md',
      contents: [
        { type: 'box', layout: 'horizontal', spacing: 'md', contents: [
          { type: 'text', text: '📱', size: 'sm', flex: 0 },
          { type: 'text', text: '0912-560-693', color: '#ffffff', size: 'sm', flex: 5 }
        ]},
        { type: 'box', layout: 'horizontal', spacing: 'md', contents: [
          { type: 'text', text: '✉️', size: 'sm', flex: 0 },
          { type: 'text', text: 'santafamily.tc@gmail.com', color: '#ffffff', size: 'sm', flex: 5 }
        ]},
        { type: 'box', layout: 'horizontal', spacing: 'md', contents: [
          { type: 'text', text: '🌐', size: 'sm', flex: 0 },
          { type: 'text', text: 'www.heyboss.com.tw', color: '#66aaff', size: 'sm', flex: 5,
            action: { type: 'uri', uri: 'https://www.heyboss.com.tw' } }
        ]},
        { type: 'box', layout: 'horizontal', spacing: 'md', contents: [
          { type: 'text', text: '🤖', size: 'sm', flex: 0 },
          { type: 'text', text: 'AI Platform', color: '#66aaff', size: 'sm', flex: 5,
            action: { type: 'uri', uri: 'https://myaiassist.heyboss.com.tw' } }
        ]},
        { type: 'separator', color: '#1a3060', margin: 'md' },
        { type: 'text', text: 'AI 建站 + SEO + 自動化', color: '#8899aa', size: 'xxs',
          align: 'center', margin: 'md' }
      ]
    },
    footer: {
      type: 'box', layout: 'horizontal',
      backgroundColor: '#0a1628',
      paddingAll: '12px', spacing: 'sm',
      contents: [
        { type: 'button', style: 'primary', color: '#06C755', height: 'sm',
          action: { type: 'uri', label: '加 LINE', uri: 'https://line.me/R/ti/p/@539qealy' }},
        { type: 'button', style: 'primary', color: '#005FDF', height: 'sm',
          action: { type: 'uri', label: '看官網', uri: 'https://www.heyboss.com.tw' }},
        { type: 'button', style: 'primary', color: '#E4405F', height: 'sm',
          action: { type: 'uri', label: '追蹤 IG', uri: 'https://www.instagram.com/travis.ai.engineer/' }}
      ]
    }
  }
};

async function initLiff() {
  try {
    await liff.init({ liffId: LIFF_ID });
    console.log('LIFF initialized');
  } catch (e) {
    console.warn('LIFF init failed:', e);
  }
}

async function shareFlexMessage() {
  if (!liff.isInClient() && !liff.isLoggedIn()) {
    // Not in LINE, open in LINE
    window.location.href = `https://liff.line.me/${LIFF_ID}`;
    return;
  }
  try {
    if (liff.isApiAvailable('shareTargetPicker')) {
      await liff.shareTargetPicker([flexMessage]);
    } else {
      await liff.sendMessages([flexMessage]);
    }
  } catch (e) {
    alert('分享失敗: ' + e.message);
  }
}

function copyLink() {
  const url = `https://liff.line.me/${LIFF_ID}`;
  navigator.clipboard.writeText(url).then(() => {
    const btn = document.querySelector('.share-btn.secondary');
    btn.textContent = '✅ 已複製！';
    setTimeout(() => { btn.innerHTML = '📋 複製名片連結'; }, 2000);
  }).catch(() => {
    // Fallback
    const ta = document.createElement('textarea');
    ta.value = url;
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    alert('已複製: ' + url);
  });
}

initLiff();
</script>
